name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: windows-x64
            extension: zip
          - runner: macos-15
            platform: macos-arm64
            extension: tar.gz
          - runner: ubuntu-24.04
            platform: linux-x64
            extension: tar.gz
    env:
      ARCHIVE: gitdesk-${{ matrix.platform }}.${{ matrix.extension }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libwayland-dev libxkbcommon-dev

      - name: Install stable Rust
        run: rustup update stable --no-self-update

      - name: Test
        run: cargo +stable test --release --locked

      - name: Build
        run: cargo +stable build --release --locked

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath target/release/gitdesk.exe -DestinationPath $env:ARCHIVE

      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: tar -czf "$ARCHIVE" -C target/release gitdesk

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish archives and checksums
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archives=(gitdesk-windows-x64.zip gitdesk-macos-arm64.tar.gz gitdesk-linux-x64.tar.gz)
          sha256sum "${archives[@]}" > SHA256SUMS
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${archives[@]}" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" "${flags[@]}"
